    <script>
      (function () {
        function showBootError(msg) {
          var root = document.getElementById('root');
          if (!root || root.getAttribute('data-mounted') === '1') return;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#070510;color:#f1f5f9;font-family:sans-serif">' +
            '<div style="max-width:460px;width:100%;border:1px solid rgba(236,72,153,.6);border-radius:16px;padding:20px;background:#0f172a">' +
            '<h1 style="margin:0 0 8px;font-size:20px">Falha ao carregar MIND//BREAK</h1>' +
            '<pre style="white-space:pre-wrap;word-break:break-word;font-size:12px;color:#f9a8d4;background:#020617;padding:10px;border-radius:8px">' +
            String(msg || 'Erro desconhecido').replace(/[<>&]/g, function (c) { return ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' })[c]; }) +
            '</pre>' +
            '<button onclick="location.reload()" style="margin-top:12px;width:100%;min-height:44px;border:0;border-radius:10px;background:#06b6d4;color:#020617;font-weight:700;cursor:pointer">Recarregar</button>' +
            '</div></div>';
        }
        window.__mbShowBootError = showBootError;
        window.addEventListener('error', function (e) { showBootError(e && (e.message || (e.error && e.error.message))); });
        window.addEventListener('unhandledrejection', function (e) { showBootError(e && e.reason && (e.reason.message || e.reason)); });
        if ('serviceWorker' in navigator) {
          var host = location.hostname || '';
          var isDevPreview = host.indexOf('ais-dev-') === 0 || host === 'localhost' || host === '127.0.0.1';
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            var stale = regs.filter(function (r) {
              var u = (r.active && r.active.scriptURL) || (r.waiting && r.waiting.scriptURL) || (r.installing && r.installing.scriptURL) || '';
              return isDevPreview || u.indexOf('dev-sw') !== -1;
            });
            if (!stale.length) return;
            Promise.all(stale.map(function (r) { return r.unregister(); }))
              .then(function () { return window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : null; })
              .finally(function () {
                try {
                  if (!sessionStorage.getItem('mb.sw.cleaned')) {
                    sessionStorage.setItem('mb.sw.cleaned', '1');
                    location.reload();
                  }
                } catch (_) {}
              });
          }).catch(function () {});
        }
      })();
    </script>

  <body style="background-color:#070510" class="bg-[#070510] text-slate-100 antialiased overflow-hidden selection:bg-pink-500 selection:text-white">
    <div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#070510;color:#94a3b8;font-family:sans-serif;font-size:14px">Carregando MIND//BREAK...</div></div>
    <script type="module" src="/src/main.tsx" onerror="window.__mbShowBootError && window.__mbShowBootError('Falha ao baixar módulo inicial /src/main.tsx')"></script>
  </body>
