<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Montagem de atlas pintado</title><style>body{background:#182238;color:#e2e8f0;font:16px system-ui}canvas{max-width:100%;height:auto}</style><h1>Atlas pintado</h1><p>Vistas independentes; continuidade visual e anatomia obrigatórias. Alinhamento por referência fixa.</p><canvas></canvas>
<script type="module">
import {paintedSourceBounds} from '/tools/paintedSourceBounds.ts';
import {REN_ATLAS,REN_LEFT_ATLAS,REN_SOURCE_POSES,renSourcePose} from '/src/game/renPainted.ts';
import {MAYA_ATLAS,MAYA_LEFT_ATLAS,MAYA_SOURCE_POSES,mayaSourcePose} from '/src/game/mayaPainted.ts';
import {LEON_ATLAS,LEON_LEFT_ATLAS} from '/src/game/leonPainted.ts';
import {leftSourceKey,leftSourceCell,directionalSourceSheets} from '/src/game/heroDirections.ts';
const query=new URLSearchParams(location.search),hero=query.get('hero')??'ren',direction=query.get('direction')??'right';
if(!['ren','maya','leon'].includes(hero)||!['right','left'].includes(direction))throw Error('Unknown hero/direction');
const maps={ren:{right:REN_ATLAS,left:REN_LEFT_ATLAS},maya:{right:MAYA_ATLAS,left:MAYA_LEFT_ATLAS},leon:{right:LEON_ATLAS,left:LEON_LEFT_ATLAS}},atlas=maps[hero][direction];

const images=await Promise.all(sheets.map(sheet=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=`/docs/arte/${hero}/fontes/${sheet.file}.png`;})));
const canvas=document.querySelector('canvas');canvas.width=atlas.width;canvas.height=atlas.height;const ctx=canvas.getContext('2d'),placements={},rendered=new Set();
function bounds(image,region){
 const{x,y,w,h}=region,c=document.createElement('canvas');c.width=w;c.height=h;const a=c.getContext('2d');a.drawImage(image,x,y,w,h,0,0,w,h);const d=a.getImageData(0,0,w,h).data;
 const found=paintedSourceBounds(d,w,h),l=found.x,t=found.y,r=l+found.w-1,b=t+found.h-1;
 let total=0,weighted=0;for(let j=Math.floor(t+(b-t)*.78);j<=b;j++)for(let i=l;i<=r;i++){const alpha=d[(j*w+i)*4+3];if(alpha>32){total+=alpha;weighted+=i*alpha;}}
 return{x:x+l,y:y+t,w:r-l+1,h:b-t+1,ignoredNeighborFragments:found.fragments,anchor:x+(total?weighted/total:(l+r)/2)};
}
for(const[pose,clip]of Object.entries(atlas.clips))for(const[frame,f]of clip.frames.entries()){
 const key=independent?leftSourceKey(hero,pose,frame):(hero==='maya'?mayaSourcePose:renSourcePose)(pose,frame);
 const source=independent?leftSourceCell(hero,key):(hero==='maya'?MAYA_SOURCE_POSES:REN_SOURCE_POSES)[key];
 const sheet=source.sheet,image=images[sheet],definition=sheets[sheet],cw=Math.floor(image.naturalWidth/definition.columns),ch=Math.floor(image.naturalHeight/definition.rows);
 const column=independent?source.column:source.cell%3,row=independent?source.row:Math.floor(source.cell/3),region={x:column*cw,y:row*ch,w:cw,h:ch};
 const crop=bounds(image,region),target=targets[pose][frame],scale=Math.min(target.height/crop.h,(f.w-16)/crop.w,(f.h-16)/crop.h);
 const dx=Math.max(8,Math.min(atlas.pivot.x-(crop.anchor-crop.x)*scale,f.w-8-crop.w*scale)),dy=Math.max(8,target.bottom-crop.h*scale),slot=`${f.x}:${f.y}`;
 if(!rendered.has(slot)){ctx.save();ctx.beginPath();ctx.rect(f.x,f.y,f.w,f.h);ctx.clip();ctx.drawImage(image,crop.x,crop.y,crop.w,crop.h,f.x+dx,f.y+dy,crop.w*scale,crop.h*scale);ctx.restore();rendered.add(slot);}
 placements[`${pose}:${frame}`]={key,sheet:definition.file,region,crop,scale,x:dx,y:dy};
}
window.paintedBuilder={canvas,metadata:{...atlas,hero,canonicalFacing:direction,mirrored:false,sourceSheets:sheets,directionalPlacements:placements,layoutReference:'tools/painted-layout.json',continuityReference:'docs/CONTINUIDADE_VISUAL.md',provenance:'Independently authored OpenAI raster paintings, revised for anatomical continuity; alpha crops aligned to frozen pose references. No runtime reflection or image-driven combat events.'}};
window.renBuilder=window.paintedBuilder;
</script></html>
