<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>MindBreak — atlas das fases</title><style>body{background:#0f172a;color:#e2e8f0;font:17px system-ui;margin:20px}select,input,button{font:inherit;padding:9px;margin:8px}#scroll{overflow:auto;border:1px solid #475569}img{display:block;max-width:none}</style><h1>Atlas das fases</h1><p>26 setores. Explore a geometria, níveis, barreiras, comandos e desvios. As linhas ciano mostram dependências dos mecanismos; não são um caminho de movimento.</p><label>Setor <select id="area"><option value="1A">1A · Fuga do Laboratório</option><option value="1B">1B · Telhados de Neon</option><option value="1C">1C · Esgotos de Manutenção</option><option value="1D">1D · Avenida Bloqueada</option><option value="2A">2A · Vagões e Embarque</option><option value="2B">2B · Cabos e Manutenção</option><option value="2C">2C · Teto e Pórticos</option><option value="3A">3A · Fundação da Torre</option><option value="3B">3B · Guindastes e Vigas</option><option value="3C">3C · Heliponto na Tormenta</option><option value="4A">4A · Tanques de Refrigeração</option><option value="4B">4B · Linhas de Esteiras</option><option value="4C">4C · Núcleo de Descarte</option><option value="5A">5A · Boulevard de Mármore</option><option value="5B">5B · Garagens e Serviços</option><option value="5C">5C · Suíte Executiva</option><option value="6A">6A · Galerias Holográficas</option><option value="6B">6B · Jardins Digitais</option><option value="6C">6C · Acervo Restrito</option><option value="7A">7A · Docas de Blacksite</option><option value="7B">7B · Blocos de Contenção</option><option value="7C">7C · Centro de Comando</option><option value="8A">8A · Base da Torre</option><option value="8B">8B · Núcleo Zero</option><option value="8C">8C · Elevador Orbital</option><option value="8D">8D · Estratosfera</option></select></label><label>Zoom <input id="zoom" type="range" min="60" max="300" value="100"></label><a id="open">Abrir SVG</a><div id="scroll"><img id="map" alt="Mapa de terreno do setor"></div><script>const a=document.querySelector('#area'),z=document.querySelector('#zoom'),m=document.querySelector('#map'),o=document.querySelector('#open');function update(){m.src='mapas/'+a.value+'.svg';m.style.width=(1800*Number(z.value)/100)+'px';o.href=m.src;}a.onchange=z.oninput=update;update();</script></html>
